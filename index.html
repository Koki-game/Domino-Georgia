<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#351609">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>DOMINO GEORGIA</title>

<style>

/* =========================================
   DOMINO GEORGIA
   PART 1/4 — PREMIUM TABLE DESIGN
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050706;
  color:#fff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* =========================================
   MAIN APP
========================================= */

#gameApp{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at center,#243129,#090d0b 70%,#020302);
}

/* =========================================
   WOOD FRAME
========================================= */

.game-shell{
  position:relative;

  width:100vw;
  height:100dvh;

  overflow:hidden;

  border:7px solid #160a04;
  border-radius:30px;

  background:
    linear-gradient(
      90deg,
      #291006 0%,
      #713415 4%,
      #361408 9%,
      #6c3012 17%,
      #321207 28%,
      #773817 40%,
      #3c1608 52%,
      #733315 65%,
      #301106 78%,
      #743617 91%,
      #2a0f05 100%
    );

  box-shadow:
    inset 0 0 0 3px #9a592b,
    inset 0 0 30px #000,
    0 15px 45px #000;
}

/* wood grain */

.game-shell::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      5deg,
      transparent 0px,
      transparent 8px,
      rgba(255,204,135,.11) 9px,
      rgba(0,0,0,.09) 11px,
      transparent 14px
    );

  opacity:.75;
}

/* =========================================
   GREEN FELT
========================================= */

.table{
  position:absolute;
  z-index:2;

  left:30px;
  right:30px;
  top:68px;
  bottom:72px;

  overflow:hidden;

  border:5px solid #251006;
  border-radius:26px;

  outline:3px solid #8a4d25;

  background:
    radial-gradient(
      ellipse at 50% 47%,
      #11623c 0%,
      #0a5132 32%,
      #064128 61%,
      #032b1c 100%
    );

  box-shadow:
    inset 0 0 80px rgba(0,0,0,.58),
    inset 0 0 15px rgba(255,255,255,.07);
}

.table::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      37deg,
      rgba(255,255,255,.014) 0,
      rgba(255,255,255,.014) 1px,
      transparent 1px,
      transparent 5px
    );
}

/* =========================================
   TOP LOGO
========================================= */

.logo-board{
  position:absolute;
  z-index:40;

  top:5px;
  left:50%;
  transform:translateX(-50%);

  width:285px;
  height:96px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:3px solid #251006;
  border-radius:0 0 23px 23px;

  background:
    linear-gradient(
      90deg,
      #321106,
      #783717 20%,
      #401708 48%,
      #743315 78%,
      #2e1005
    );

  box-shadow:
    inset 0 0 0 2px rgba(255,200,120,.15),
    inset 0 -12px 18px rgba(0,0,0,.42),
    0 7px 13px rgba(0,0,0,.75);
}

.logo-main{
  font-family:Georgia,serif;
  font-size:35px;
  font-weight:900;
  letter-spacing:2px;

  color:#f7dda0;

  text-shadow:
    0 2px #5a290d,
    0 4px 5px #000;
}

.logo-sub{
  display:flex;
  align-items:center;
  gap:11px;

  margin-top:2px;

  font-family:Georgia,serif;
  font-size:18px;
  letter-spacing:5px;

  color:#fff0c1;
}

.logo-sub .flag{
  font-size:19px;
  letter-spacing:0;
}

/* =========================================
   OLD STYLE "CHOTKA" SCORE
========================================= */

.scoreboard{
  position:absolute;
  z-index:30;

  top:9px;

  width:235px;
  height:50px;

  display:flex;
  align-items:center;

  padding:6px 10px;

  border:2px solid #633716;
  border-radius:10px;

  background:
    linear-gradient(#29180e,#100b08);

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.12),
    0 4px 9px rgba(0,0,0,.65);
}

.score-team-a{
  left:95px;
}

.score-team-b{
  right:95px;
}

.team-info{
  width:73px;
  flex:none;
}

.team-name{
  color:#f5d996;
  font-size:12px;
  font-weight:900;
}

.team-number{
  margin-top:2px;
  font-size:16px;
  font-weight:900;
  color:#fff5d5;
}

/* CHOTKA */

.chotka{
  position:relative;
  flex:1;

  height:35px;

  overflow:hidden;

  border-radius:7px;

  border:1px solid #67482b;

  background:
    linear-gradient(#120e0a,#24180f);
}

.chotka-line{
  position:absolute;

  left:8px;
  right:8px;

  height:2px;

  background:#9b7647;

  box-shadow:0 1px #000;
}

.chotka-line.line1{
  top:11px;
}

.chotka-line.line2{
  top:23px;
}

.beads{
  position:absolute;
  inset:0;
}

.bead{
  position:absolute;

  width:9px;
  height:9px;

  border-radius:50%;

  background:
    radial-gradient(circle at 35% 30%,#fff0ad,#b7892e 48%,#5e3c0d 100%);

  border:1px solid #2b1906;

  box-shadow:
    0 1px 2px #000;
}

/* =========================================
   TOP ROUND BUTTONS
========================================= */

.round-btn{
  position:absolute;
  z-index:45;

  top:12px;

  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:2px solid #74441e;

  background:
    linear-gradient(#3a291d,#17100c);

  color:#f7dfad;
  font-size:23px;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.18),
    0 5px 10px #000;
}

.menu-btn{
  left:20px;
}

.chat-top{
  right:72px;
}

.settings-btn{
  right:18px;
}

/* =========================================
   PLAYER CARDS
========================================= */

.player-card{
  position:absolute;
  z-index:15;

  width:205px;
  height:67px;

  display:flex;
  align-items:center;
  gap:9px;

  padding:7px 11px;

  border-radius:15px;

  border:1px solid rgba(230,199,112,.42);

  background:
    linear-gradient(
      135deg,
      rgba(6,61,39,.95),
      rgba(3,35,25,.94)
    );

  box-shadow:
    0 6px 14px rgba(0,0,0,.38),
    inset 0 0 14px rgba(0,0,0,.22);
}

.player-0{
  left:25px;
  bottom:19px;
}

.player-1{
  left:35px;
  top:27px;
}

.player-2{
  right:35px;
  top:27px;
}

.player-3{
  right:25px;
  bottom:19px;
}

.avatar{
  position:relative;

  width:51px;
  height:51px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:3px solid #e0b65c;

  background:
    radial-gradient(circle,#48625c,#101d19);

  box-shadow:
    0 0 0 2px #0b2a20,
    0 3px 7px #000;

  font-size:27px;
}

.online-dot{
  position:absolute;

  left:-3px;
  bottom:0;

  width:14px;
  height:14px;

  border-radius:50%;

  background:#26e43b;

  border:2px solid #d8f8d8;

  box-shadow:0 0 7px #22ff3c;
}

.player-data{
  min-width:0;
  flex:1;
}

.player-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:14px;
  font-weight:900;
}

.rating{
  margin-top:4px;

  color:#ffd76b;
  font-size:13px;
  font-weight:bold;
}

.team-badge{
  position:absolute;

  right:7px;
  bottom:5px;

  color:#d4c492;
  font-size:9px;
}

/* =========================================
   CENTER GEORGIAN MARK
========================================= */

.georgia-mark{
  position:absolute;

  z-index:3;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  color:rgba(230,208,132,.075);

  font-size:130px;

  pointer-events:none;
}

/* =========================================
   GAME STATUS
========================================= */

#gameStatus{
  position:absolute;
  z-index:25;

  left:50%;
  top:105px;

  transform:translateX(-50%);

  min-width:150px;

  padding:6px 16px;

  text-align:center;

  border:1px solid rgba(229,198,112,.35);
  border-radius:18px;

  background:rgba(0,0,0,.34);

  color:#f5e7bd;
  font-size:13px;
}

/* =========================================
   DOMINO BOARD
========================================= */

#dominoBoard{
  position:absolute;
  z-index:8;

  left:17%;
  right:17%;
  top:28%;
  bottom:30%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:visible;
}

/* =========================================
   DOMINO TILE
========================================= */

.domino{
  position:relative;

  width:44px;
  height:84px;

  flex:none;

  overflow:hidden;

  border:2px solid #d6c89f;
  border-radius:7px;

  background:
    linear-gradient(
      135deg,
      #fffceb,
      #eee4c8 55%,
      #cabc94
    );

  box-shadow:
    inset 2px 2px 3px rgba(255,255,255,.9),
    inset -3px -3px 4px rgba(80,60,35,.24),
    0 5px 7px rgba(0,0,0,.58);
}

.domino.horizontal{
  width:84px;
  height:44px;
}

.domino-divider{
  position:absolute;

  left:5px;
  right:5px;
  top:50%;

  height:2px;

  transform:translateY(-1px);

  background:#29251d;
}

.domino.horizontal .domino-divider{
  top:5px;
  bottom:5px;
  left:50%;

  width:2px;
  height:auto;

  transform:translateX(-1px);
}

/* =========================================
   DOMINO PIPS
========================================= */

.domino-half{
  position:absolute;
  left:0;
  width:100%;
  height:50%;
}

.half-a{
  top:0;
}

.half-b{
  bottom:0;
}

.domino.horizontal .domino-half{
  top:0;
  width:50%;
  height:100%;
}

.domino.horizontal .half-a{
  left:0;
}

.domino.horizontal .half-b{
  left:50%;
}

.pip{
  position:absolute;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#171612;

  box-shadow:
    inset 1px 1px 1px #000,
    0 1px 1px rgba(255,255,255,.3);
}

.p1{left:18%;top:18%}
.p2{right:18%;top:18%}
.p3{left:18%;top:44%}
.p4{left:50%;top:50%;transform:translate(-50%,-50%)}
.p5{right:18%;top:44%}
.p6{left:18%;bottom:15%}
.p7{right:18%;bottom:15%}

/* =========================================
   PLAYER HAND
========================================= */

.hand-wrap{
  position:absolute;
  z-index:20;

  left:50%;
  bottom:13px;

  transform:translateX(-50%);

  width:52%;
}

#playerHand{
  display:flex;
  align-items:flex-end;
  justify-content:center;

  gap:4px;
}

#playerHand .domino{
  width:44px;
  height:84px;

  transition:
    transform .16s ease,
    filter .16s ease;
}

#playerHand .domino.selected{
  transform:translateY(-12px);

  filter:
    drop-shadow(0 0 7px #baff68);
}

/* =========================================
   PASS BUTTON
========================================= */

#passBtn{
  position:absolute;
  z-index:25;

  right:24px;
  bottom:25px;

  width:137px;
  height:53px;

  border:3px solid #6fff70;
  border-radius:18px;

  background:
    radial-gradient(
      ellipse at top,
      #24a42b,
      #08641a 65%,
      #033b0e
    );

  color:#f4fff1;

  font-size:18px;
  font-weight:900;

  text-shadow:0 2px #003800;

  box-shadow:
    inset 0 0 12px rgba(120,255,115,.65),
    0 0 12px rgba(65,255,75,.65),
    0 7px 14px rgba(0,0,0,.55);
}

/* =========================================
   ROOM PANEL
========================================= */

.room-panel{
  position:absolute;
  z-index:22;

  right:17px;
  top:107px;

  width:143px;

  padding:10px;

  border:1px solid #59635e;
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(8,25,22,.96),
      rgba(3,12,11,.96)
    );

  box-shadow:0 6px 14px rgba(0,0,0,.55);
}

.room-label{
  color:#c9d0cc;
  font-size:11px;
}

.room-code{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:4px 0 7px;

  color:#fff;
  font-size:17px;
  font-weight:900;
}

.invite-btn{
  width:100%;

  padding-top:7px;

  border:0;
  border-top:1px solid #46534d;

  background:transparent;

  color:#fff;

  text-align:left;
  font-size:12px;
  font-weight:bold;
}

/* =========================================
   BOTTOM WOOD MENU
========================================= */

.bottom-menu{
  position:absolute;
  z-index:35;

  left:17%;
  right:17%;
  bottom:4px;

  height:53px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:5px;
}

.bottom-menu button{
  border:2px solid #604020;
  border-radius:15px;

  background:
    linear-gradient(#39271b,#17100c);

  color:#f5ead7;

  font-size:13px;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.12),
    0 4px 9px rgba(0,0,0,.55);
}

.bottom-menu span{
  margin-right:5px;
  font-size:19px;
}

/* =========================================
   EMOJI PANEL
========================================= */

#emojiPanel{
  position:absolute;
  z-index:70;

  left:50%;
  bottom:65px;

  transform:translateX(-50%);

  display:none;
  gap:6px;

  padding:9px;

  border:2px solid #6e4b2c;
  border-radius:15px;

  background:rgba(15,13,11,.97);

  box-shadow:0 8px 22px #000;
}

#emojiPanel.open{
  display:flex;
}

.emoji-choice{
  width:43px;
  height:43px;

  border:1px solid #65513b;
  border-radius:10px;

  background:#29221c;

  font-size:22px;
}

/* =========================================
   LOGIN
========================================= */

#loginOverlay{
  position:absolute;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.78);
  backdrop-filter:blur(5px);
}

.login-card{
  width:min(380px,90%);

  padding:25px;

  text-align:center;

  border:3px solid #73421e;
  border-radius:22px;

  background:
    linear-gradient(145deg,#3d1c0b,#15100c);

  box-shadow:
    0 15px 40px #000;
}

.login-card h1{
  margin-bottom:7px;

  font-family:Georgia,serif;
  color:#f1d18b;
}

.login-card p{
  margin-bottom:16px;
  color:#d8c9aa;
}

#nicknameInput{
  width:100%;

  margin-bottom:10px;
  padding:12px;

  border:1px solid #927044;
  border-radius:11px;

  outline:none;

  background:#0c1714;
  color:#fff;

  font-size:16px;
}

.google-login{
  width:100%;

  padding:12px;

  border:0;
  border-radius:11px;

  background:#fff;
  color:#222;

  font-size:16px;
  font-weight:900;
}

/* =========================================
   ROTATE PHONE
========================================= */

.rotate-message{
  display:none;

  position:fixed;
  inset:0;
  z-index:9999;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:25px;

  text-align:center;

  background:
    radial-gradient(circle,#125038,#051a12);
}

.rotate-phone{
  margin-bottom:15px;
  font-size:65px;
}

.rotate-message h2{
  margin-bottom:8px;
}

.rotate-message p{
  color:#d6e6dd;
}

/* =========================================
   SMALL LANDSCAPE PHONE
========================================= */

@media(max-height:500px){

  .table{
    top:58px;
    bottom:57px;
    left:22px;
    right:22px;
  }

  .logo-board{
    width:245px;
    height:79px;
  }

  .logo-main{
    font-size:28px;
  }

  .logo-sub{
    font-size:14px;
  }

  .scoreboard{
    width:205px;
    height:43px;
  }

  .score-team-a{
    left:80px;
  }

  .score-team-b{
    right:80px;
  }

  .player-card{
    width:175px;
    height:57px;
  }

  .avatar{
    width:43px;
    height:43px;
    font-size:22px;
  }

  .player-name{
    font-size:12px;
  }

  #playerHand .domino{
    width:40px;
    height:76px;
  }

  #passBtn{
    width:120px;
    height:47px;
    font-size:16px;
  }

  .room-panel{
    width:128px;
  }
}

@media(orientation:portrait) and (max-width:800px){

  .rotate-message{
    display:flex;
  }

}

</style>
</head>

  <!-- =========================================

     4 PLAYER GEORGIAN DOMINO ENGINE
========================================= -->

<script>

const $ = id => document.getElementById(id);

/* =========================================
   BASIC GAME STATE
========================================= */

const game = {

  hands: [[],[],[],[]],

  board: [],

  leftEnd: null,
  rightEnd: null,

  currentPlayer: 0,

  roundStarter: null,

  /* player who caused the riba */
  ribaStarter: null,

  selectedIndex: null,

  started: false,
  roundFinished: false,

  consecutivePasses: 0,

  roundNumber: 1,

  /*
    TEAM A = players 0 + 2
    TEAM B = players 1 + 3
  */

  teamScores: [0,0],

  pendingPoints: 0,

  /* after 355 is reached,
     match waits for a normal round ending
  */

  finishPending: false,

  matchFinished: false,

  firstRound: true

};


/* =========================================
   TEAMS
========================================= */

function getTeam(player){

  return (player === 0 || player === 2)
    ? 0
    : 1;

}


function otherTeam(team){

  return team === 0 ? 1 : 0;

}


/* =========================================
   5 POINT ROUNDING
========================================= */

function roundToFive(points){

  if(points <= 0){
    return 0;
  }

  return Math.ceil(points / 5) * 5;

}


/* =========================================
   CREATE 28 DOMINOES
========================================= */

function createDominoSet(){

  const tiles = [];

  for(let a = 0; a <= 6; a++){

    for(let b = a; b <= 6; b++){

      tiles.push({

        a,
        b,

        id:`${a}-${b}`

      });

    }

  }

  return tiles;

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

  const arr = [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      arr[i],
      arr[j]
    ] = [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================================
   DEAL ALL 28 TILES
========================================= */

function dealTiles(){

  const deck =
    shuffle(
      createDominoSet()
    );

  game.hands =
    [[],[],[],[]];


  /*
    4 players × 7 tiles
  */

  for(let i = 0; i < 28; i++){

    const player =
      i % 4;

    game.hands[player]
      .push(deck[i]);

  }

}


/* =========================================
   FIND 6-6 OWNER
========================================= */

function findSixSixOwner(){

  for(
    let player = 0;
    player < 4;
    player++
  ){

    const found =
      game.hands[player]
        .some(
          tile =>
            tile.a === 6 &&
            tile.b === 6
        );

    if(found){
      return player;
    }

  }

  return 0;

}


/* =========================================
   PIP LAYOUTS
========================================= */

const pipLayouts = {

  0:[],

  1:["p4"],

  2:[
    "p1",
    "p7"
  ],

  3:[
    "p1",
    "p4",
    "p7"
  ],

  4:[
    "p1",
    "p2",
    "p6",
    "p7"
  ],

  5:[
    "p1",
    "p2",
    "p4",
    "p6",
    "p7"
  ],

  6:[
    "p1",
    "p2",
    "p3",
    "p5",
    "p6",
    "p7"
  ]

};


/* =========================================
   CREATE DOMINO HALF
========================================= */

function createHalf(
  number,
  className
){

  const half =
    document.createElement("div");

  half.className =
    `domino-half ${className}`;


  pipLayouts[number]
    .forEach(position=>{

      const pip =
        document.createElement("span");

      pip.className =
        `pip ${position}`;

      half.appendChild(pip);

    });


  return half;

}


/* =========================================
   CREATE DOMINO ELEMENT
========================================= */

function createDominoElement(
  tile,
  horizontal = false
){

  const domino =
    document.createElement("div");


  domino.className =
    horizontal
      ? "domino horizontal"
      : "domino";


  const halfA =
    createHalf(
      tile.a,
      "half-a"
    );


  const halfB =
    createHalf(
      tile.b,
      "half-b"
    );


  const divider =
    document.createElement("div");

  divider.className =
    "domino-divider";


  domino.appendChild(halfA);
  domino.appendChild(halfB);
  domino.appendChild(divider);


  return domino;

}


/* =========================================
   CAN TILE PLAY?
========================================= */

function canPlay(tile){

  if(game.board.length === 0){
    return true;
  }


  return(

    tile.a === game.leftEnd ||

    tile.b === game.leftEnd ||

    tile.a === game.rightEnd ||

    tile.b === game.rightEnd

  );

}


/* =========================================
   DOES PLAYER HAVE A MOVE?
========================================= */

function playerHasMove(player){

  return game.hands[player]
    .some(
      tile => canPlay(tile)
    );

}


/* =========================================
   FIND TILE INDEX
========================================= */

function findTileIndex(
  player,
  a,
  b
){

  return game.hands[player]
    .findIndex(tile=>

      (
        tile.a === a &&
        tile.b === b
      )

      ||

      (
        tile.a === b &&
        tile.b === a
      )

    );

}


/* =========================================
   ORIENT LEFT
========================================= */

function orientForLeft(tile){

  if(tile.b === game.leftEnd){

    return {
      a:tile.a,
      b:tile.b
    };

  }


  return {
    a:tile.b,
    b:tile.a
  };

}


/* =========================================
   ORIENT RIGHT
========================================= */

function orientForRight(tile){

  if(tile.a === game.rightEnd){

    return {
      a:tile.a,
      b:tile.b
    };

  }


  return {
    a:tile.b,
    b:tile.a
  };

}


/* =========================================
   PLAYER HAND
========================================= */

function renderPlayerHand(){

  const handBox =
    $("playerHand");

  handBox.innerHTML = "";


  game.hands[0]
    .forEach(
      (tile,index)=>{

        const domino =
          createDominoElement(
            tile,
            false
          );


        if(
          game.currentPlayer !== 0 ||
          !canPlay(tile) ||
          game.roundFinished
        ){

          domino.style.opacity =
            ".58";

        }


        if(
          game.selectedIndex === index
        ){

          domino.classList.add(
            "selected"
          );

        }


        domino.onclick = ()=>{

          if(
            game.matchFinished ||
            game.roundFinished
          ){
            return;
          }


          if(
            game.currentPlayer !== 0
          ){

            showStatus(
              "ახლა შენი სვლა არ არის"
            );

            return;
          }


          if(!canPlay(tile)){

            showStatus(
              "ეს ქვა ვერ დაიდება"
            );

            return;
          }


          game.selectedIndex =
            index;

          renderPlayerHand();

          chooseSideAndPlay(
            tile,
            index
          );

        };


        handBox.appendChild(
          domino
        );

      }
    );

}


/* =========================================
   CHOOSE SIDE
========================================= */

function chooseSideAndPlay(
  tile,
  index
){

  if(game.board.length === 0){

    playTile(
      0,
      index,
      "right"
    );

    return;

  }


  const fitsLeft =

    tile.a === game.leftEnd ||
    tile.b === game.leftEnd;


  const fitsRight =

    tile.a === game.rightEnd ||
    tile.b === game.rightEnd;


  if(
    fitsLeft &&
    !fitsRight
  ){

    playTile(
      0,
      index,
      "left"
    );

    return;

  }


  if(
    fitsRight &&
    !fitsLeft
  ){

    playTile(
      0,
      index,
      "right"
    );

    return;

  }


  /*
    If it fits both ends,
    currently right side is selected.

    Later we can add visual
    LEFT / RIGHT selection.
  */

  if(
    fitsLeft &&
    fitsRight
  ){

    playTile(
      0,
      index,
      "right"
    );

  }

}


/* =========================================
   PLAY TILE
========================================= */

function playTile(
  player,
  handIndex,
  side
){

  if(
    game.roundFinished ||
    game.matchFinished
  ){
    return;
  }


  if(
    player !== game.currentPlayer
  ){
    return;
  }


  const tile =
    game.hands[player][handIndex];


  if(!tile){
    return;
  }


  /*
    FIRST ROUND:
    FIRST TILE MUST BE 6-6
  */

  if(
    game.firstRound &&
    game.board.length === 0
  ){

    if(
      tile.a !== 6 ||
      tile.b !== 6
    ){

      return;

    }

  }


  let playedTile;


  /* FIRST TILE */

  if(game.board.length === 0){

    playedTile = {

      a:tile.a,
      b:tile.b,
      player

    };


    game.board.push(
      playedTile
    );


    game.leftEnd =
      playedTile.a;

    game.rightEnd =
      playedTile.b;

  }


  /* LEFT SIDE */

  else if(side === "left"){

    const oriented =
      orientForLeft(tile);


    playedTile = {

      ...oriented,
      player

    };


    game.board.unshift(
      playedTile
    );


    game.leftEnd =
      oriented.a;

  }


  /* RIGHT SIDE */

  else{

    const oriented =
      orientForRight(tile);


    playedTile = {

      ...oriented,
      player

    };


    game.board.push(
      playedTile
    );


    game.rightEnd =
      oriented.b;

  }


  game.hands[player]
    .splice(
      handIndex,
      1
    );


  game.selectedIndex =
    null;


  /*
    Any successful tile resets
    ordinary pass sequence.
  */

  game.consecutivePasses = 0;


  renderBoard();
  renderPlayerHand();


  /*
    Player has used the final tile.
    Part 3 will calculate team score.
  */

  if(
    game.hands[player].length === 0
  ){

    finishNormalRound(
      player
    );

    return;

  }


  nextTurn();

}


/* =========================================
   BOARD RENDER
========================================= */

function renderBoard(){

  const board =
    $("dominoBoard");

  board.innerHTML = "";


  const snake =
    document.createElement("div");


  snake.style.cssText = `

    width:100%;
    height:100%;

    display:flex;
    flex-wrap:wrap;

    align-content:center;
    justify-content:center;
    align-items:center;

    gap:3px;

  `;


  game.board
    .forEach(tile=>{

      /*
        Doubles are vertical.
        Other tiles horizontal.
      */

      const isDouble =
        tile.a === tile.b;


      const domino =
        createDominoElement(
          tile,
          !isDouble
        );


      if(isDouble){

        domino.style.margin =
          "0 3px";

      }


      snake.appendChild(
        domino
      );

    });


  board.appendChild(
    snake
  );

}


/* =========================================
   PLAYER NAME FOR STATUS
========================================= */

function playerLabel(player){

  if(player === 0){

    return (
      typeof profile !== "undefined" &&
      profile.nickname
    )
      ? profile.nickname
      : "შენ";

  }


  return `მოთამაშე ${player}`;

}


/* =========================================
   NEXT TURN
========================================= */

function nextTurn(){

  if(
    game.roundFinished ||
    game.matchFinished
  ){
    return;
  }


  game.currentPlayer =
    (game.currentPlayer + 1) % 4;


  updateTurnStatus();


  if(game.currentPlayer === 0){

    renderPlayerHand();

    return;

  }


  /*
    Temporary local opponents.

    Online Firebase players
    will replace this later.
  */

  setTimeout(
    computerTurn,
    500
  );

}


/* =========================================
   COMPUTER PLAYER
========================================= */

function computerTurn(){

  if(
    game.roundFinished ||
    game.matchFinished
  ){
    return;
  }


  const player =
    game.currentPlayer;


  /*
    On the first hand, the 6-6 owner
    MUST open with 6-6.
  */

  if(
    game.firstRound &&
    game.board.length === 0
  ){

    const sixSix =
      findTileIndex(
        player,
        6,
        6
      );


    if(sixSix !== -1){

      playTile(
        player,
        sixSix,
        "right"
      );

      return;

    }

  }


  const hand =
    game.hands[player];


  const playable =
    hand.findIndex(
      tile => canPlay(tile)
    );


  /* NO MOVE */

  if(playable === -1){

    handlePass(
      player
    );

    return;

  }


  const tile =
    hand[playable];


  const fitsLeft =

    tile.a === game.leftEnd ||
    tile.b === game.leftEnd;


  const fitsRight =

    tile.a === game.rightEnd ||
    tile.b === game.rightEnd;


  let side =
    "right";


  if(
    fitsLeft &&
    !fitsRight
  ){

    side =
      "left";

  }


  playTile(
    player,
    playable,
    side
  );

}


/* =========================================
   PASS
========================================= */

function handlePass(player){

  if(
    playerHasMove(player)
  ){

    if(player === 0){

      showStatus(
        "სვლა გაქვს — ქვა უნდა დადო"
      );

    }

    return;

  }


  game.consecutivePasses++;


  showStatus(
    `${playerLabel(player)} — გავიარე`
  );


  /*
    Part 3 will contain the complete
    Georgian RIBA resolution.
  */

  if(
    game.consecutivePasses >= 4
  ){

    finishRiba();

    return;

  }


  setTimeout(
    nextTurn,
    450
  );

}


/* =========================================
   MY PASS BUTTON
========================================= */

$("passBtn").onclick = ()=>{

  if(
    game.currentPlayer !== 0 ||
    game.roundFinished ||
    game.matchFinished
  ){

    return;

  }


  handlePass(0);

};


/* =========================================
   STATUS
========================================= */

function showStatus(text){

  $("gameStatus")
    .textContent = text;

}


/* =========================================
   TURN STATUS
========================================= */

function updateTurnStatus(){

  if(game.matchFinished){
    return;
  }


  if(game.currentPlayer === 0){

    showStatus(
      "შენი სვლაა"
    );

  }else{

    showStatus(
      `${playerLabel(game.currentPlayer)}-ის სვლაა`
    );

  }

}


/* =========================================
   START FIRST ROUND
========================================= */

function startFirstRound(){

  game.board = [];

  game.leftEnd = null;
  game.rightEnd = null;

  game.selectedIndex = null;

  game.roundFinished = false;
  game.matchFinished = false;

  game.consecutivePasses = 0;

  game.firstRound = true;

  dealTiles();


  /*
    First ever round:
    whoever has 6-6 starts.
  */

  game.roundStarter =
    findSixSixOwner();

  game.currentPlayer =
    game.roundStarter;


  renderBoard();
  renderPlayerHand();

  updateTurnStatus();


  if(game.currentPlayer !== 0){

    setTimeout(
      computerTurn,
      700
    );

  }

}


/* =========================================
   PLACEHOLDERS FOR PART 3

   PART 3 will replace these with:
   - team scoring
   - 5-point rounding
   - RIBA
   - equal RIBA carry
   - 355 rule
   - next-round starter
========================================= */

function finishNormalRound(winner){

  game.roundFinished = true;

  showStatus(
    `პარტია დასრულდა — ${playerLabel(winner)}`
  );

}


function finishRiba(){

  game.roundFinished = true;

  showStatus(
    "🔒 რიბა"
  );

}


/* =========================================
   START ENGINE
========================================= */

startFirstRound();

</script>

<script>

/* =========================================
   HAND / TEAM POINT TOTALS
========================================= */

function handPips(player){

  return game.hands[player].reduce(
    (sum,tile) => sum + tile.a + tile.b,
    0
  );

}

function teamRemainingPips(team){

  if(team === 0){

    /* TEAM A = players 0 + 2 */

    return (
      handPips(0) +
      handPips(2)
    );

  }

  /* TEAM B = players 1 + 3 */

  return (
    handPips(1) +
    handPips(3)
  );

}


/* =========================================
   TEAM NAME
========================================= */

function teamName(team){

  return team === 0
    ? "გუნდი A"
    : "გუნდი B";

}


/* =========================================
   CHOTKA VISUAL
========================================= */

function drawChotka(
  elementId,
  score
){

  const box =
    $(elementId);

  if(!box){
    return;
  }

  box.innerHTML = "";


  /*
    Visual representation only.
    Exact score remains visible
    numerically as X / 355.
  */

  const maxBeads = 14;

  const visible =
    Math.min(
      maxBeads,
      Math.floor(score / 25)
    );


  for(
    let i = 0;
    i < maxBeads;
    i++
  ){

    const bead =
      document.createElement("span");

    bead.className =
      "bead";


    const row =
      i < 7 ? 0 : 1;

    const column =
      i % 7;


    bead.style.top =
      row === 0
        ? "7px"
        : "19px";


    bead.style.left =
      (8 + column * 13) + "px";


    if(i >= visible){

      bead.style.opacity =
        ".22";

    }


    box.appendChild(
      bead
    );

  }

}


/* =========================================
   UPDATE TEAM SCORE UI
========================================= */

function updateTeamScores(){

  $("teamAScore").textContent =
    game.teamScores[0];

  $("teamBScore").textContent =
    game.teamScores[1];


  drawChotka(
    "beadsA",
    game.teamScores[0]
  );

  drawChotka(
    "beadsB",
    game.teamScores[1]
  );

}


/* =========================================
   ADD SCORE
========================================= */

function addTeamScore(
  team,
  points
){

  game.teamScores[team] +=
    points;


  /*
    355 does NOT immediately
    finish the match.
  */

  if(
    game.teamScores[0] >= 355 ||
    game.teamScores[1] >= 355
  ){

    game.finishPending =
      true;

  }


  updateTeamScores();

}


/* =========================================
   START NEXT HAND
========================================= */

function startNextRound(
  starter
){

  if(game.matchFinished){
    return;
  }


  game.roundNumber++;

  game.board = [];

  game.leftEnd = null;
  game.rightEnd = null;

  game.selectedIndex = null;

  game.roundFinished = false;

  game.consecutivePasses = 0;

  game.ribaStarter = null;

  game.firstRound = false;


  dealTiles();


  game.roundStarter =
    starter;

  game.currentPlayer =
    starter;


  renderBoard();
  renderPlayerHand();

  updateTurnStatus();


  if(game.currentPlayer !== 0){

    setTimeout(
      computerTurn,
      700
    );

  }

}


/* =========================================
   FINAL MATCH CHECK

   355 RULE:
   - reaching 355 alone does not end match
   - current hand must finish
   - RIBA cannot finish match
   - after a NON-RIBA hand,
     compare totals
========================================= */

function resolveMatchAfterNormalRound(){

  if(!game.finishPending){
    return false;
  }


  /*
    If somehow scores are tied,
    continue playing.
  */

  if(
    game.teamScores[0] ===
    game.teamScores[1]
  ){

    showStatus(
      "⚖️ ქულები თანაბარია — თამაში გრძელდება"
    );

    return false;

  }


  const winner =
    game.teamScores[0] >
    game.teamScores[1]
      ? 0
      : 1;


  game.matchFinished =
    true;

  game.roundFinished =
    true;


  showStatus(
    `🏆 ${teamName(winner)} მოიგო — ` +
    `${game.teamScores[0]} : ${game.teamScores[1]}`
  );


  return true;

}


/* =========================================
   NORMAL HAND FINISH

   Winner's team receives BOTH
   opposing players' remaining pips,
   rounded UP to nearest 5.
========================================= */

finishNormalRound = function(
  winnerPlayer
){

  if(game.roundFinished){
    return;
  }


  game.roundFinished =
    true;


  const winnerTeam =
    getTeam(
      winnerPlayer
    );


  const loserTeam =
    otherTeam(
      winnerTeam
    );


  const opponentPips =
    teamRemainingPips(
      loserTeam
    );


  const newPoints =
    roundToFive(
      opponentPips
    );


  /*
    Equal-riba accumulated points
    are awarded to the next
    normal hand winner.
  */

  const carry =
    game.pendingPoints;


  const totalAward =
    newPoints + carry;


  game.pendingPoints =
    0;


  addTeamScore(
    winnerTeam,
    totalAward
  );


  let message =
    `🏆 ${teamName(winnerTeam)} +${newPoints}`;


  if(carry > 0){

    message +=
      ` + დაგროვილი ${carry}`;

  }


  showStatus(
    message
  );


  /*
    If 355 had been reached,
    THIS normal hand may now
    finish the match.
  */

  if(
    resolveMatchAfterNormalRound()
  ){

    return;

  }


  /*
    Normal hand:
    player who went out
    starts next hand.
  */

  setTimeout(
    ()=>{
      startNextRound(
        winnerPlayer
      );
    },
    1500
  );

};


/* =========================================
   RIBA FINISH
========================================= */

finishRiba = function(){

  if(game.roundFinished){
    return;
  }


  game.roundFinished =
    true;


  const teamA =
    teamRemainingPips(0);

  const teamB =
    teamRemainingPips(1);


  /* =====================================
     EQUAL RIBA
  ===================================== */

  if(teamA === teamB){

    /*
      Carry the common remaining amount,
      rounded up to nearest 5.
    */

    const carry =
      roundToFive(
        teamA
      );


    game.pendingPoints +=
      carry;


    showStatus(
      `🔒 რიბა — თანაბარი ${teamA}:${teamB} • დაგროვდა ${game.pendingPoints}`
    );


    /*
      RIBA never ends the match.
    */

    const starter =
      game.ribaStarter !== null
        ? game.ribaStarter
        : game.roundStarter;


    setTimeout(
      ()=>{
        startNextRound(
          starter
        );
      },
      1700
    );


    return;

  }


  /* =====================================
     NORMAL RIBA
  ===================================== */

  const winnerTeam =
    teamA < teamB
      ? 0
      : 1;


  const loserPips =
    winnerTeam === 0
      ? teamB
      : teamA;


  const points =
    roundToFive(
      loserPips
    );


  addTeamScore(
    winnerTeam,
    points
  );


  showStatus(
    `🔒 რიბა • ${teamName(winnerTeam)} +${points}`
  );


  /*
    IMPORTANT:
    RIBA does NOT resolve the match
    even if 355 has been reached.
  */


  const starter =
    game.ribaStarter !== null
      ? game.ribaStarter
      : game.roundStarter;


  setTimeout(
    ()=>{
      startNextRound(
        starter
      );
    },
    1700
  );

};


/* =========================================
   RIBA CLOSER DETECTION

   Save the player who lays the tile
   immediately before the final
   playable double.

   This supports the Georgian rule:
   if the board is effectively closed
   but somebody can still lay the
   matching double, that double may
   still be played, while the previous
   player remains the riba starter.
========================================= */

function countPlayersWithMoves(){

  let count = 0;

  for(let p = 0; p < 4; p++){

    if(playerHasMove(p)){
      count++;
    }

  }

  return count;

}


/*
  Keep reference to original playTile.
*/

const originalPlayTile =
  playTile;


playTile = function(
  player,
  handIndex,
  side
){

  const tile =
    game.hands[player][handIndex];


  if(!tile){
    return;
  }


  /*
    Remember who made the move.
  */

  const playerBefore =
    player;


  originalPlayTile(
    player,
    handIndex,
    side
  );


  if(
    game.roundFinished ||
    game.matchFinished
  ){
    return;
  }


  /*
    After this move, inspect all
    remaining legal moves.

    If only a matching double can
    still be played, remember the
    PREVIOUS player as the one who
    caused the riba.
  */

  let legalTiles = [];


  for(let p = 0; p < 4; p++){

    game.hands[p]
      .forEach(t=>{

        if(canPlay(t)){

          legalTiles.push({
            player:p,
            tile:t
          });

        }

      });

  }


  if(legalTiles.length > 0){

    const onlyDoubles =
      legalTiles.every(
        item =>
          item.tile.a ===
          item.tile.b
      );


    if(onlyDoubles){

      game.ribaStarter =
        playerBefore;

    }

  }

};


/* =========================================
   PASS BUTTON VISUAL STATE
========================================= */

function updatePassButton(){

  if(
    game.currentPlayer === 0 &&
    !game.roundFinished &&
    !playerHasMove(0)
  ){

    $("passBtn").style.opacity =

      true;

}


/*

  pass button always updates.
*/

renderPlayerHand = function(){

  originalRenderPlayerHand();

  updatePassButton();

};


/* =========================================
   SCORE / CHOTKA INITIAL DISPLAY
========================================= */

updateTeamScores();
updatePassButton();

</script>

<script>

    showStatus(

/* =========================================
   INVITE
========================================= */

$("inviteBtn").onclick =
async ()=>{

  const code =
    $("roomCode").textContent;


  const url =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(code);


  if(navigator.share){

    try{

      await navigator.share({
        title:"DOMINO GEORGIA",
        text:"შემოდი ჩემს დომინოს ოთახში",
        url:url
      });

      return;

    }catch(error){}

  }


  try{

    await navigator.clipboard
      .writeText(url);

    showStatus(
      "მოწვევის ბმული დაკოპირდა"
    );

  }catch(error){

    showStatus(

    );

  }

};

   READ ROOM FROM URL
========================================= */

  new URLSearchParams(
    location.search
  );


const incomingRoom =
  safeText(
    urlParams.get("room") || ""
  );


if(incomingRoom){

  $("roomCode").textContent =
    incomingRoom.toUpperCase();

}


/* =========================================
   CREATE RANDOM ROOM CODE
========================================= */

function createRoomCode(){

  if(incomingRoom){
    return;
  }


  const saved =
    localStorage.getItem(
      "dominoRoomCode"
    );


  if(saved){

    $("roomCode").textContent =
      saved;

    return;

  }


  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let code = "";


  for(let i = 0; i < 6; i++){

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }


  localStorage.setItem(
    "dominoRoomCode",
    code
  );


  $("roomCode").textContent =
    code;

}
