<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#2b1208">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>DOMINO GEORGIA</title>

<style>

/* =========================================
   DOMINO GEORGIA V3
   PART 1/4 — PREMIUM TABLE
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#32180d,#080503 78%);
}


/* =========================================
   WOOD SHELL
========================================= */

.shell{
  position:absolute;
  inset:0;
  overflow:hidden;

  border:5px solid #160905;

  background:
    linear-gradient(
      90deg,
      #281006,
      #713817 5%,
      #351408 11%,
      #6a3114 19%,
      #2d1006 31%,
      #6d3416 48%,
      #301107 63%,
      #703617 80%,
      #301106 92%,
      #783c1a
    );

  box-shadow:
    inset 0 0 0 3px #a25b2d,
    inset 0 0 35px #000;
}

.shell::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      3deg,
      transparent 0,
      transparent 8px,
      rgba(255,205,135,.09) 9px,
      transparent 11px
    );

  opacity:.75;
}


/* =========================================
   TOP PANEL
========================================= */

.top-panel{
  position:absolute;

  left:.8%;
  right:.8%;
  top:.8%;

  height:20.5%;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    31%
    minmax(0,1fr);

  gap:8px;

  z-index:20;
}


/* =========================================
   CHOTKA / TEAM SCORE
========================================= */

.team-score{
  position:relative;
  overflow:hidden;

  border:3px solid #3a1609;
  border-radius:13px;

  background:
    linear-gradient(
      180deg,
      rgba(92,43,19,.97),
      rgba(29,13,7,.98)
    );

  box-shadow:
    inset 0 0 0 2px #8c4c27,
    inset 0 0 20px #000,
    0 4px 8px rgba(0,0,0,.8);
}

.team-title{
  height:25%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#f6dfb1;

  font-size:clamp(13px,1.45vw,24px);
  font-weight:900;

  text-shadow:0 2px 2px #000;

  border-bottom:2px solid #4a2412;

  background:
    linear-gradient(
      #49210f,
      #241008
    );
}

.score-body{
  height:75%;

  display:grid;
  grid-template-columns:76% 24%;

  align-items:center;
}

.abacus{
  height:94%;

  padding:4px 7px;

  display:grid;
  grid-template-rows:repeat(5,1fr);

  gap:1px;
}

.abacus-row{
  position:relative;

  display:flex;
  align-items:center;

  padding-left:35px;
}

.abacus-label{
  position:absolute;
  left:2px;

  width:30px;

  color:#f6d89c;

  font-size:clamp(9px,.9vw,15px);
  font-weight:bold;
}

.rail{
  position:relative;

  width:100%;
  height:3px;

  border-radius:3px;

  background:#b26a37;

  box-shadow:
    0 1px 0 #2a1008,
    inset 0 1px rgba(255,255,255,.25);
}

.beads{
  position:absolute;

  left:0;
  right:0;
  top:50%;

  transform:translateY(-50%);

  display:flex;
  gap:2px;
}

.bead{
  width:12px;
  height:18px;

  border-radius:50%;

  border:1px solid #3a180b;

  background:
    linear-gradient(
      90deg,
      #54240e,
      #d58a47 42%,
      #f2b66c 52%,
      #733214 78%,
      #321309
    );

  box-shadow:
    inset 1px 0 rgba(255,255,255,.35),
    0 1px 2px #000;

  transition:
    transform .25s ease,
    filter .25s ease;
}

.bead.off{
  filter:brightness(.38);
}

.team-total{
  display:flex;
  align-items:center;
  justify-content:center;

  height:100%;

  color:#ffe0a0;

  font-family:Georgia,serif;

  font-size:clamp(16px,1.8vw,30px);
  font-weight:900;

  text-shadow:0 3px 4px #000;
}


/* =========================================
   CENTER LOGO
========================================= */

.logo{
  position:relative;

  z-index:25;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:4px solid #321308;
  border-radius:0 0 18px 18px;

  background:
    radial-gradient(
      ellipse at 50% 20%,
      #8b421e,
      #52230f 48%,
      #2b1007 100%
    );

  box-shadow:
    inset 0 0 0 3px rgba(181,101,49,.55),
    inset 0 -15px 25px rgba(0,0,0,.55),
    0 7px 12px #000;
}

.logo::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      5deg,
      transparent 0,
      transparent 8px,
      rgba(255,215,150,.05) 9px,
      transparent 11px
    );
}

.logo-main{
  position:relative;
  z-index:2;

  color:#ffe5ad;

  font-family:Georgia,serif;
  font-size:clamp(30px,3.7vw,58px);
  font-weight:900;

  letter-spacing:2px;
  line-height:.95;

  text-shadow:
    0 3px 0 #6a3215,
    0 6px 7px #000;
}

.logo-sub{
  position:relative;
  z-index:2;

  margin-top:7px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:15px;

  color:#ffe4ad;

  font-family:Georgia,serif;

  font-size:clamp(14px,1.8vw,28px);

  letter-spacing:8px;
}

.logo-flag{
  letter-spacing:0;
  font-size:clamp(16px,2vw,30px);
}


/* =========================================
   GREEN PLAYING TABLE

   IMPORTANT:
   boardViewport is the HARD boundary.
   Dominoes will never leave this area.
========================================= */

.table-area{
  position:absolute;

  left:14.2%;
  right:14.2%;

  top:24%;
  bottom:17%;

  z-index:5;

  overflow:hidden;

  border:5px solid #32150b;
  border-radius:4px;

  outline:2px solid #92502a;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      #126743 0%,
      #075033 55%,
      #033620 100%
    );

  box-shadow:
    inset 0 0 70px rgba(0,0,0,.65),
    inset 0 0 8px rgba(255,255,255,.12),
    0 5px 15px #000;
}

.table-area::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.014) 0,
      rgba(255,255,255,.014) 1px,
      transparent 1px,
      transparent 5px
    );
}


/* Board safety zone */

#boardViewport{
  position:absolute;

  left:4%;
  right:4%;
  top:16%;
  bottom:17%;

  overflow:hidden;

  z-index:10;

  pointer-events:none;
}


/*
  PART 3 will automatically scale
  this entire layer when the domino
  layout grows.
*/

#dominoBoard{
  position:absolute;

  left:50%;
  top:50%;

  width:1000px;
  height:600px;

  transform:
    translate(-50%,-50%)
    scale(1);

  transform-origin:center center;

  pointer-events:none;
}


/* =========================================
   WATERMARK
========================================= */

.watermark{
  position:absolute;

  left:50%;
  top:52%;

  transform:translate(-50%,-50%);

  text-align:center;

  color:rgba(211,201,133,.075);

  pointer-events:none;
}

.crown{
  font-size:clamp(48px,7vw,105px);
  line-height:.8;
}

.watermark-text{
  margin-top:18px;

  font-family:Georgia,serif;

  font-size:clamp(12px,1.3vw,20px);

  letter-spacing:6px;
}


/* =========================================
   ROOM INFO
========================================= */

.room-info{
  position:absolute;

  left:.7%;
  top:24%;

  width:12.5%;
  height:22%;

  z-index:10;

  padding:9px 8px;

  border-top:3px solid #5c2b15;
  border-bottom:3px solid #321208;

  background:
    linear-gradient(
      90deg,
      rgba(15,10,7,.97),
      rgba(31,17,10,.94)
    );

  box-shadow:
    inset -10px 0 20px rgba(0,0,0,.45);
}

.room-info small{
  display:block;

  color:#d7c9b2;

  font-size:clamp(8px,.8vw,14px);

  margin-bottom:4px;
}

.room-info strong{
  display:block;

  color:#fff3d2;

  font-size:clamp(10px,1vw,17px);

  margin-bottom:7px;
}

.online{
  color:#25ef61;

  font-size:clamp(9px,.9vw,15px);
}


/* =========================================
   RIGHT NOTE
========================================= */

.side-note{
  position:absolute;

  right:.7%;
  top:24%;

  width:11.5%;
  height:18%;

  z-index:10;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;

  color:#e9e4d9;

  font-family:Georgia,serif;
  font-style:italic;

  font-size:clamp(8px,.9vw,15px);

  text-align:center;

  border:2px solid #34302b;
  border-radius:12px 0 0 12px;

  background:
    linear-gradient(
      145deg,
      #161616,
      #080808
    );

  box-shadow:
    0 5px 12px #000,
    inset 0 0 15px rgba(255,255,255,.04);
}


/* =========================================
   PLAYER AVATARS

   Names are NOT permanently visible.
========================================= */

.player{
  position:absolute;

  z-index:90;

  width:62px;
  height:62px;

  pointer-events:auto;
}

.avatar{
  position:relative;

  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:4px solid #e5b957;

  background:
    radial-gradient(
      circle,
      #4c6267,
      #101719
    );

  box-shadow:
    0 0 0 2px #3c210d,
    0 5px 10px #000;

  font-size:32px;

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.avatar:active{
  transform:scale(.94);
}


/* current player */

.player.active .avatar{
  box-shadow:
    0 0 0 2px #3c210d,
    0 0 18px #ffe164,
    0 5px 10px #000;
}

.online-dot{
  position:absolute;

  right:-1px;
  bottom:1px;

  width:17px;
  height:17px;

  border-radius:50%;

  border:3px solid #dfffe5;

  background:#1ff04d;

  box-shadow:
    0 0 8px #22ff54;
}


/* positions */

.player-top{
  left:50%;
  top:20.8%;

  transform:translateX(-50%);
}

.player-left{
  left:10.8%;
  top:53%;

  transform:translateY(-50%);
}

.player-right{
  right:10.8%;
  top:53%;

  transform:translateY(-50%);
}

.player-bottom{
  left:50%;
  bottom:23%;

  transform:translateX(-50%);
}


/* =========================================
   PLAYER INFO POPUP
========================================= */

.player-popup{
  position:fixed;

  z-index:1000;

  display:none;

  min-width:175px;

  padding:11px 14px;

  border:2px solid #9b6a34;
  border-radius:13px;

  color:#eee5d5;

  background:
    linear-gradient(
      145deg,
      rgba(16,35,29,.98),
      rgba(5,15,13,.98)
    );

  box-shadow:
    0 12px 28px rgba(0,0,0,.85);
}

.player-popup.show{
  display:block;
}

.player-popup-name{
  color:#fff2cf;

  font-size:16px;
  font-weight:900;
}

.player-popup-rating{
  margin-top:5px;

  color:#ffd565;

  font-weight:bold;
}

.player-popup-stats{
  margin-top:8px;

  color:#cfc6b6;

  font-size:12px;

  line-height:1.55;
}


/* =========================================
   HIDDEN OPPONENT TILES
========================================= */

.hidden-hand{
  position:absolute;

  display:flex;
  gap:2px;

  z-index:15;

  pointer-events:none;
}

.hidden-top{
  left:50%;
  top:29%;

  transform:translateX(-50%);
}

.hidden-left{
  left:14.7%;
  top:43%;

  flex-direction:column;
}

.hidden-right{
  right:14.7%;
  top:43%;

  flex-direction:column;
}

.hidden-bottom{
  display:none;
}

.tile-back{
  width:35px;
  height:46px;

  border-radius:5px;

  border:2px solid #111;

  background:
    repeating-linear-gradient(
      45deg,
      #111 0,
      #111 3px,
      #2d2d2d 3px,
      #2d2d2d 5px
    );

  box-shadow:
    inset 0 0 0 2px #4d4d4d,
    0 4px 5px rgba(0,0,0,.75);
}


/* =========================================
   TURN MESSAGE
========================================= */

#turnMessage{
  position:absolute;

  left:50%;
  top:29%;

  transform:translateX(-50%);

  z-index:120;

  min-width:170px;

  padding:6px 15px;

  border-radius:20px;

  text-align:center;

  color:#ffe6a3;

  border:1px solid rgba(255,212,102,.4);

  background:rgba(18,28,20,.91);

  box-shadow:
    0 4px 10px rgba(0,0,0,.55);

  font-size:13px;
  font-weight:bold;

  opacity:0;

  pointer-events:none;

  transition:opacity .25s;
}

#turnMessage.show{
  opacity:1;
}


/* =========================================
   ROTATE SCREEN
========================================= */

.rotate{
  display:none;

  position:fixed;
  inset:0;

  z-index:9999;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#071d14;

  text-align:center;

  padding:25px;
}

.rotate div{
  font-size:65px;
}

.rotate h2{
  margin-top:15px;
}


/* =========================================
   PHONE LANDSCAPE
========================================= */

@media(max-height:550px){

  .top-panel{
    height:21%;
  }

  .bead{
    width:9px;
    height:14px;
  }

  .player{
    width:48px;
    height:48px;
  }

  .avatar{
    width:48px;
    height:48px;

    border-width:3px;

    font-size:24px;
  }

  .online-dot{
    width:14px;
    height:14px;
  }

  .player-bottom{
    bottom:22%;
  }

  .room-info{
    padding:6px;
  }

}


/* portrait */

@media(orientation:portrait) and (max-width:800px){

  .rotate{
    display:flex;
  }

}


/* ===== PART 1/4 END ===== */
