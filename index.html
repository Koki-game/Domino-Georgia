<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07150e">

<title>DOMINO GEORGIA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080d0b;
  font-family:Arial,sans-serif;
  color:#fff;
}

button{font-family:inherit}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#07170f;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.rotateBox{
  font-size:20px;
  line-height:1.7;
}

.rotatePhone{
  font-size:55px;
  margin-bottom:10px;
}

/* MAIN SCREEN */

#app{
  position:relative;
  width:100vw;
  height:100dvh;
  min-width:700px;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 35%,#164d35,#07140e 72%);
}

/* WOOD TABLE */

.table{
  position:absolute;
  left:1.5%;
  right:1.5%;
  top:1.5%;
  bottom:8%;

  border-radius:45px;

  background:
    linear-gradient(90deg,
      #2b1409,
      #70401f 8%,
      #3b1c0d 20%,
      #80502a 50%,
      #3b1c0d 80%,
      #6b391b 92%,
      #241007);

  padding:25px;

  box-shadow:
    0 14px 30px #000,
    inset 0 0 0 3px #b27a42,
    inset 0 0 0 8px #1c0d07;
}

/* FELT */

.felt{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;

  border-radius:29px;

  background:
    radial-gradient(circle at 50% 42%,
      #0c693d 0%,
      #07502f 55%,
      #04351f 100%);

  box-shadow:
    inset 0 0 35px #000a,
    inset 0 0 0 2px #183d2d;
}

.felt:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.17;

  background:
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 3px,
      #ffffff09 4px
    );
}

/* TOP TITLE */

.titleBoard{
  position:absolute;
  z-index:30;
  top:-13px;
  left:50%;
  transform:translateX(-50%);

  width:300px;
  height:92px;

  border-radius:0 0 25px 25px;

  background:
    linear-gradient(90deg,
      #351708,
      #75421e,
      #4a230e,
      #75421e,
      #351708);

  border:3px solid #2a1006;

  box-shadow:
    0 7px 15px #000b,
    inset 0 0 12px #c17c3c55;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.titleBoard h1{
  font-family:Georgia,serif;
  font-size:31px;
  letter-spacing:2px;
  color:#ffe5a4;

  text-shadow:
    0 2px #5a250d,
    0 3px 5px #000;
}

.titleBoard .sub{
  font-family:Georgia,serif;
  font-size:16px;
  letter-spacing:5px;
  color:#fff1bf;
}

.flags{
  position:absolute;
  top:57px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:17px;
}

/* MENU */

.circleBtn{
  position:absolute;
  z-index:50;

  width:45px;
  height:45px;

  border-radius:50%;
  border:2px solid #76502e;

  background:
    linear-gradient(#35251a,#15100c);

  color:#f4e4c4;
  font-size:22px;

  box-shadow:0 3px 8px #000b;
}

#menuBtn{
  top:11px;
  left:15px;
}

#chatTop{
  top:11px;
  right:62px;
}

#settingsBtn{
  top:11px;
  right:13px;
}

/* PLAYERS */

.playerCard{
  position:absolute;
  z-index:20;

  height:74px;
  width:225px;

  border-radius:16px;

  background:
    linear-gradient(90deg,#0b3427dd,#0a422ddd);

  border:1px solid #4b7d61;

  box-shadow:0 4px 13px #0008;

  display:flex;
  align-items:center;
  padding:8px 10px;
  gap:10px;
}

.playerCard.topLeft{
  left:55px;
  top:32px;
}

.playerCard.topRight{
  right:55px;
  top:32px;
}

.playerCard.me{
  left:20px;
  bottom:26px;
  width:210px;
}

.avatar{
  position:relative;
  width:57px;
  height:57px;
  flex-shrink:0;

  border-radius:50%;
  border:3px solid #e8c266;

  background:
    radial-gradient(circle at 50% 35%,#365c4e,#13241d);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:29px;

  box-shadow:0 2px 7px #000;
}

.online{
  position:absolute;
  left:-2px;
  bottom:0;

  width:15px;
  height:15px;

  border-radius:50%;
  background:#20e347;

  border:2px solid #d8f8d9;
}

.pName{
  font-weight:900;
  font-size:16px;
}

.rating{
  margin-top:7px;
  color:#ffd96d;
  font-size:16px;
  font-weight:bold;
}

/* SCORES */

.scoreText{
  position:absolute;
  z-index:20;

  top:112px;
  font-family:Georgia,serif;
  font-size:17px;
  color:#f5eee0;
}

.scoreLeft{left:100px}
.scoreRight{right:100px}

/* CENTER WATERMARK */

.watermark{
  position:absolute;
  z-index:1;

  left:50%;
  top:43%;

  transform:translate(-50%,-50%);

  font-size:105px;
  opacity:.08;
}

/* BOARD */

#board{
  position:absolute;
  z-index:10;

  left:24%;
  right:24%;
  top:31%;
  bottom:34%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:2px;
}

/* DOMINO */

.domino{
  position:relative;

  width:39px;
  height:76px;

  flex-shrink:0;

  border-radius:7px;

  background:
    linear-gradient(145deg,#fff9df,#e5dcc2);

  border:1px solid #b9ae91;

  box-shadow:
    2px 5px 6px #0009,
    inset 1px 1px 2px #fff;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.domino.horizontal{
  width:76px;
  height:39px;
  flex-direction:row;
}

.half{
  position:relative;
  flex:1;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  padding:4px;
}

.domino:not(.horizontal)
.half:first-child{
  border-bottom:2px solid #28251f;
}

.domino.horizontal
.half:first-child{
  border-right:2px solid #28251f;
}

.cell{
  display:flex;
  align-items:center;
  justify-content:center;
}

.pip{
  width:7px;
  height:7px;

  border-radius:50%;

  background:
    radial-gradient(circle at 35% 30%,#3d3d3d,#050505 70%);

  box-shadow:inset 0 1px 1px #666;
}

/* SIDE CLOSED TILES */

.sideStack{
  position:absolute;
  z-index:15;

  top:160px;

  display:flex;
  flex-direction:column;

  gap:-3px;
}

.sideStack.left{left:19px}
.sideStack.right{right:19px}

.backTile{
  width:48px;
  height:70px;

  margin-top:-8px;

  border-radius:9px;

  background:
    radial-gradient(circle,#303237,#17191d);

  border:3px solid #b29b78;

  box-shadow:
    2px 4px 6px #000;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#777;
  font-size:27px;
}

/* ROOM BOX */

.roomBox{
  position:absolute;
  z-index:30;

  right:15px;
  top:116px;

  width:150px;

  border-radius:14px;

  background:#0c1213e8;
  border:1px solid #49504d;

  padding:12px;

  box-shadow:0 5px 15px #0009;
}

.roomSmall{
  font-size:12px;
  color:#ccc;
}

.roomCode{
  font-size:20px;
  font-weight:900;
  margin:4px 0 9px;
  letter-spacing:1px;
}

.shareBtn{
  width:100%;

  border:0;
  border-top:1px solid #555;

  background:transparent;
  color:white;

  padding-top:8px;
  font-weight:bold;
}

/* YOUR HAND */

#hand{
  position:absolute;
  z-index:25;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  display:flex;
  align-items:flex-end;
  justify-content:center;

  gap:5px;
}

.handTile{
  position:relative;
  transition:.16s;
  cursor:pointer;
}

.handTile:hover,
.handTile.selected{
  transform:translateY(-12px);
  filter:drop-shadow(0 0 6px #e5e66b);
}

/* TURN BUTTON */

#turnBtn{
  position:absolute;
  z-index:40;

  right:28px;
  bottom:34px;

  min-width:180px;

  padding:16px 20px;

  border-radius:22px;

  border:2px solid #66ff73;

  background:
    linear-gradient(#178b2b,#075e16);

  color:#fff;

  font-size:19px;
  font-weight:900;

  box-shadow:
    0 0 15px #24ff47aa,
    inset 0 0 8px #7dff87;
}

/* GOOD GAME */

.goodGame{
  position:absolute;
  z-index:5;

  left:50%;
  bottom:132px;

  transform:translateX(-50%);

  font-family:Georgia,serif;
  letter-spacing:4px;

  color:#d7d0a2;
  opacity:.8;

  font-size:11px;
  text-align:center;
}

/* BOTTOM BAR */

.bottomBar{
  position:absolute;
  z-index:60;

  left:13%;
  right:13%;
  bottom:0;

  height:52px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  border-radius:17px 17px 0 0;

  overflow:hidden;

  background:#211812;
  border:1px solid #5e422c;

  box-shadow:0 -3px 10px #0009;
}

.bottomBtn{
  border:0;
  border-right:1px solid #62452e;

  background:
    linear-gradient(#2e2119,#17110d);

  color:#eee1ce;

  font-size:14px;
}

.bottomBtn span{
  font-size:21px;
  margin-right:5px;
}

/* EMOJI PANEL */

#emojiPanel{
  display:none;

  position:absolute;
  z-index:100;

  left:14%;
  bottom:57px;

  width:230px;

  padding:9px;

  border-radius:15px;

  background:#111b17f2;
  border:1px solid #876d43;

  grid-template-columns:repeat(6,1fr);
  gap:5px;
}

.emoji{
  height:34px;
  border:0;
  border-radius:8px;
  background:#ffffff12;
  font-size:20px;
}

/* MESSAGE */

#message{
  display:none;

  position:absolute;
  z-index:200;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  padding:13px 22px;

  border-radius:15px;

  background:#071b12ef;
  border:1px solid #d4b45f;

  font-weight:bold;
  text-align:center;

  box-shadow:0 5px 20px #000;
}

/* PORTRAIT */

@media(orientation:portrait){
  #app{display:none}

  #rotate{
    display:flex;
  }
}

@media(max-height:500px){

  .table{
    padding:18px;
  }

  .titleBoard{
    height:76px;
    width:260px;
  }

  .titleBoard h1{
    font-size:26px;
  }

  .playerCard{
    transform:scale(.88);
  }

  #hand{
    transform:
      translateX(-50%)
      scale(.86);

    transform-origin:bottom center;
  }

  .goodGame{
    display:none;
  }
}
</style>
</head>

<body>

<div id="rotate">
  <div class="rotateBox">
    <div class="rotatePhone">📱↻</div>
    <b>DOMINO GEORGIA</b><br>
    მოაბრუნე ტელეფონი ჰორიზონტალურად
  </div>
</div>

<div id="app">

  <div class="table">

    <div class="felt">

      <button class="circleBtn" id="menuBtn">☰</button>
      <button class="circleBtn" id="chatTop">💬</button>
      <button class="circleBtn" id="settingsBtn">⚙</button>

      <div class="titleBoard">
        <h1>DOMINO</h1>
        <div class="sub">GEORGIA</div>

        <div class="flags">
          <span>🇬🇪</span>
          <span>🇬🇪</span>
        </div>
      </div>

      <div class="playerCard topLeft">

        <div class="avatar">
          😎
          <i class="online"></i>
        </div>

        <div>
          <div class="pName">Player 1</div>
          <div class="rating">⭐ 1250</div>
        </div>

      </div>

      <div class="playerCard topRight">

        <div class="avatar">
          🧔
          <i class="online"></i>
        </div>

        <div>
          <div class="pName">Player 2</div>
          <div class="rating">⭐ 980</div>
        </div>

      </div>

      <div class="scoreText scoreLeft">
        ქულა: <b>0</b>
      </div>

      <div class="scoreText scoreRight">
        ქულა: <b>0</b>
      </div>

      <div class="watermark">🇬🇪</div>

      <div class="sideStack left">
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
      </div>

      <div class="sideStack right">
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
        <div class="backTile">✥</div>
      </div>

      <div class="roomBox">
        <div class="roomSmall">ოთახი:</div>
        <div class="roomCode" id="roomCode">AB12CD</div>
        <button class="shareBtn" id="shareBtn">
          მოწვევა 🔗
        </button>
      </div>

      <div id="board"></div>

      <div class="goodGame">
        ─── GOOD GAME ───<br>
        GOOD PEOPLE
      </div>

      <div class="playerCard me">

        <div class="avatar">
          👤
          <i class="online"></i>
        </div>

        <div>
          <div class="pName" id="myName">Nickname</div>
          <div class="rating">⭐ <span id="myRating">1100</span></div>
        </div>

      </div>

      <div id="hand"></div>

      <button id="turnBtn">
        შენი სვლაა
      </button>

      <div id="emojiPanel">
        <button class="emoji">👍</button>
        <button class="emoji">👏</button>
        <button class="emoji">😂</button>
        <button class="emoji">😎</button>
        <button class="emoji">🔥</button>
        <button class="emoji">🤝</button>

        <button class="emoji">🎯</button>
        <button class="emoji">🏆</button>
        <button class="emoji">❤️</button>
        <button class="emoji">😮</button>
        <button class="emoji">💪</button>
        <button class="emoji">👋</button>
      </div>

      <div id="message"></div>

    </div>

  </div>

  <div class="bottomBar">

    <button class="bottomBtn" id="emojiBtn">
      <span>☺</span> ემოჯი
    </button>

    <button class="bottomBtn" id="chatBtn">
      <span>💬</span> ჩატი
    </button>

    <button class="bottomBtn" id="passBtn">
      <span>💡</span> გავიარე
    </button>

    <button class="bottomBtn" id="reportBtn">
      <span>⚑</span> დახმარება
    </button>

  </div>

</div>

<script>

/* =========================
   DOMINO VISUAL ENGINE
========================= */

const $ = id =>
  document.getElementById(id);

const positions = {
  0:[],
  1:[5],
  2:[1,9],
  3:[1,5,9],
  4:[1,3,7,9],
  5:[1,3,5,7,9],
  6:[1,3,4,6,7,9]
};

function makeHalf(num){

  const half =
    document.createElement("div");

  half.className = "half";

  for(let i=1;i<=9;i++){

    const cell =
      document.createElement("div");

    cell.className = "cell";

    if(
      positions[num].includes(i)
    ){

      const pip =
        document.createElement("i");

      pip.className = "pip";

      cell.appendChild(pip);
    }

    half.appendChild(cell);
  }

  return half;
}

function makeDomino(
  a,
  b,
  horizontal=false
){

  const d =
    document.createElement("div");

  d.className =
    "domino" +
    (horizontal
      ? " horizontal"
      : "");

  d.appendChild(
    makeHalf(a)
  );

  d.appendChild(
    makeHalf(b)
  );

  return d;
}


/* =========================
   SAMPLE TABLE CHAIN
========================= */

const sampleBoard = [
  [5,5,false],
  [5,4,true],
  [4,4,true],
  [4,3,true],
  [3,6,true],
  [6,6,false],
  [6,2,true],
  [2,1,true],
  [1,5,true],
  [5,5,false]
];

function drawBoard(){

  const board = $("board");

  board.innerHTML = "";

  sampleBoard.forEach(tile=>{

    board.appendChild(
      makeDomino(
        tile[0],
        tile[1],
        tile[2]
      )
    );

  });
}


/* =========================
   PLAYER HAND
========================= */

let myHand = [
  [0,1],
  [1,1],
  [4,6],
  [4,4],
  [2,3],
  [3,5],
  [2,5]
];

function drawHand(){

  const hand = $("hand");

  hand.innerHTML = "";

  myHand.forEach((tile,index)=>{

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "handTile";

    wrapper.appendChild(
      makeDomino(
        tile[0],
        tile[1]
      )
    );

    wrapper.onclick = ()=>{

      document
        .querySelectorAll(
          ".handTile"
        )
        .forEach(x=>
          x.classList
            .remove("selected")
        );

      wrapper
        .classList
        .add("selected");

    };

    hand.appendChild(
      wrapper
    );

  });

}


/* =========================
   NICKNAME
========================= */

let nickname =
  localStorage.getItem(
    "dominoNickname"
  );

if(!nickname){

  nickname =
    prompt(
      "აირჩიე თამაშის Nickname:"
    );

  if(!nickname){
    nickname = "Player";
  }

  nickname =
    nickname
      .trim()
      .slice(0,16);

  localStorage.setItem(
    "dominoNickname",
    nickname
  );
}

$("myName").textContent =
  nickname;


/* =========================
   EMOJI ONLY CHAT
========================= */

function toggleEmoji(){

  const panel =
    $("emojiPanel");

  panel.style.display =
    panel.style.display === "grid"
      ? "none"
      : "grid";
}

$("emojiBtn").onclick =
  toggleEmoji;

$("chatBtn").onclick =
  toggleEmoji;

$("chatTop").onclick =
  toggleEmoji;


document
.querySelectorAll(".emoji")
.forEach(btn=>{

  btn.onclick = ()=>{

    showMessage(
      nickname +
      ": " +
      btn.textContent
    );

    $("emojiPanel")
      .style.display =
      "none";
  };

});


/* =========================
   PASS
========================= */

$("passBtn").onclick = ()=>{

  showMessage(
    "გავიარე"
  );

};


/* =========================
   ROOM SHARE
========================= */

$("shareBtn").onclick =
async ()=>{

  const code =
    $("roomCode")
      .textContent;

  const link =
    location.href.split("?")[0]
    + "?room="
    + code;

  if(navigator.share){

    try{

      await navigator.share({
        title:"DOMINO GEORGIA",
        text:
          "შემოდი ჩემს დომინოს ოთახში",
        url:link
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard
        .writeText(link);

      showMessage(
        "მოწვევის ლინკი დაკოპირდა"
      );

    }catch(e){

      showMessage(
        "ოთახი: " + code
      );

    }
  }
};


/* =========================
   INVITE CODE
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const invited =
  params.get("room");

if(invited){

  const safeCode =
    invited
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      )
      .slice(0,6);

  if(safeCode){

    $("roomCode")
      .textContent =
      safeCode;
  }
}


/* =========================
   MESSAGES
========================= */

let messageTimer;

function showMessage(text){

  clearTimeout(
    messageTimer
  );

  const msg =
    $("message");

  msg.textContent =
    text;

  msg.style.display =
    "block";

  messageTimer =
    setTimeout(()=>{

      msg.style.display =
        "none";

    },1400);
}


/* MENU */

$("menuBtn").onclick = ()=>{

  showMessage(
    "DOMINO GEORGIA 🇬🇪"
  );

};

$("settingsBtn").onclick = ()=>{

  showMessage(
    "პარამეტრები მალე დაემატება"
  );

};

$("reportBtn").onclick = ()=>{

  showMessage(
    "დახმარება"
  );

};

$("turnBtn").onclick = ()=>{

  showMessage(
    "აირჩიე დასადები ქვა"
  );

};


/* START */

drawBoard();
drawHand();

</script>

</body>
</html>
