<style>

/* =========================================================
   DOMINO GEORGIA
   1536 × 1024 MASTER DESIGN
   PART 1/4
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050403;

  font-family:
    Arial,
    "Noto Sans Georgian",
    sans-serif;

  user-select:none;
  touch-action:manipulation;
}

button{
  font-family:inherit;
}


/* =========================================================
   VIEWPORT
========================================================= */

#viewport{
  position:fixed;
  inset:0;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      ellipse at center,
      #25140b 0%,
      #080504 70%,
      #000 100%
    );
}


/* =========================================================
   MASTER SCENE
   Exact design coordinate system: 1536 × 1024
========================================================= */

#scene{
  position:absolute;

  left:50%;
  top:50%;

  width:1536px;
  height:1024px;

  transform-origin:center center;

  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #281208 0%,
      #5b2b13 2%,
      #311509 7%,
      #1c0d07 50%,
      #311509 93%,
      #5b2b13 98%,
      #281208 100%
    );

  box-shadow:
    0 0 70px #000;
}


/* outer carved wood */

#scene::before{
  content:"";

  position:absolute;
  inset:0;

  z-index:1;

  pointer-events:none;

  border:10px solid #713817;

  box-shadow:
    inset 0 0 0 4px #b56b35,
    inset 0 0 0 10px #2b1208,
    inset 0 0 40px #000,
    0 0 30px #000;
}


/* wood texture */

#scene::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:2;

  pointer-events:none;

  opacity:.20;

  background:
    repeating-linear-gradient(
      2deg,
      transparent 0,
      transparent 7px,
      rgba(255,184,104,.16) 8px,
      transparent 10px
    );
}


/* =========================================================
   TOP AREA
========================================================= */

#topArea{
  position:absolute;

  left:15px;
  top:12px;

  width:1506px;
  height:202px;

  z-index:20;

  display:grid;

  grid-template-columns:
    515px
    476px
    515px;
}


/* =========================================================
   TEAM SCORE PANELS
========================================================= */

.score-panel{
  position:relative;

  height:202px;

  overflow:hidden;

  color:#f8e3b5;

  background:
    linear-gradient(
      180deg,
      #542711 0%,
      #2c1208 28%,
      #170b06 100%
    );

  border:3px solid #6e3518;

  box-shadow:
    inset 0 0 0 2px #a75d2c,
    inset 0 0 25px rgba(0,0,0,.8),
    0 5px 12px rgba(0,0,0,.75);
}

.score-panel.left{
  border-radius:22px 5px 5px 22px;
}

.score-panel.right{
  border-radius:5px 22px 22px 5px;
}

.team-title{
  position:absolute;

  left:0;
  right:0;
  top:8px;

  height:37px;

  text-align:center;

  color:#f7e5bf;

  font-size:25px;
  line-height:37px;
  font-weight:900;

  text-shadow:
    0 3px 2px #000;
}


/* =========================================================
   OLD STYLE CHOTKA
========================================================= */

.chotka{
  position:absolute;

  left:18px;
  top:50px;

  width:355px;
  height:138px;

  padding:
    4px
    4px
    4px
    52px;
}

.chotka-row{
  position:relative;

  width:290px;
  height:26px;
}

.chotka-label{
  position:absolute;

  left:-46px;
  top:2px;

  width:40px;

  color:#e9d7ad;

  font-size:17px;
  font-weight:900;

  text-align:right;

  text-shadow:
    0 2px 2px #000;
}

.chotka-rail{
  position:absolute;

  left:0;
  right:0;
  top:12px;

  height:4px;

  border-radius:4px;

  background:
    linear-gradient(
      #d3945d,
      #67381d
    );

  box-shadow:
    0 1px 2px #000;
}

.chotka-beads{
  position:absolute;

  left:3px;
  right:3px;
  top:1px;

  height:24px;

  display:flex;
  align-items:center;

  gap:3px;
}

.bead{
  width:14px;
  height:23px;

  flex:0 0 14px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      #6c3518,
      #c47b3d 35%,
      #e5a55f 50%,
      #8b461f 75%,
      #3e1d0e
    );

  border:
    1px solid #5b2b15;

  box-shadow:
    inset 1px 0 1px rgba(255,255,255,.35),
    1px 2px 2px rgba(0,0,0,.7);
}

.bead.off{
  background:
    linear-gradient(
      90deg,
      #17100d,
      #39251a 45%,
      #110c09
    );

  border-color:#352419;

  opacity:.72;
}


/* =========================================================
   EXACT NUMERIC SCORE
========================================================= */

.numeric-score{
  position:absolute;

  right:15px;
  top:93px;

  width:130px;

  text-align:center;

  color:#ffe1a2;

  font-family:
    Georgia,
    serif;

  font-size:31px;
  line-height:40px;
  font-weight:900;

  white-space:nowrap;

  text-shadow:
    0 3px 2px #000,
    0 0 9px rgba(255,184,73,.15);
}


/* =========================================================
   CENTER DOMINO GEORGIA LOGO
========================================================= */

#logoPanel{
  position:relative;

  height:202px;

  overflow:hidden;

  text-align:center;

  background:
    radial-gradient(
      ellipse at center,
      #603018 0%,
      #351609 57%,
      #180b06 100%
    );

  border-top:
    3px solid #6f3618;

  border-bottom:
    3px solid #6f3618;

  box-shadow:
    inset 0 0 0 2px #9b572d,
    inset 0 0 28px #000;
}

#logoMain{
  margin-top:15px;

  color:#ffe2a0;

  font-family:
    Georgia,
    serif;

  font-size:59px;
  line-height:65px;
  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 5px 3px #000,
    0 0 8px rgba(255,204,113,.35);
}

#logoSub{
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:25px;

  color:#f5d99f;

  font-family:
    Georgia,
    serif;

  font-size:28px;

  letter-spacing:12px;

  text-shadow:
    0 3px 2px #000;
}

.flag{
  font-size:32px;
  letter-spacing:0;
}

#logoMotto{
  margin-top:3px;

  color:#c6a97e;

  font-size:13px;
  letter-spacing:1px;
}


/* =========================================================
   MAIN AREA
========================================================= */

#mainArea{
  position:absolute;

  left:15px;
  top:214px;

  width:1506px;
  height:684px;

  z-index:10;

  background:
    linear-gradient(
      90deg,
      #3c1c0e 0%,
      #2b130a 14%,
      #160b06 15%,
      #160b06 85%,
      #2b130a 86%,
      #3c1c0e 100%
    );
}


/* =========================================================
   GREEN TABLE FRAME
========================================================= */

#tableFrame{
  position:absolute;

  left:195px;
  top:34px;

  width:1116px;
  height:548px;

  padding:10px;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #82471f,
      #2a1208 45%,
      #8d5027
    );

  box-shadow:
    inset 0 0 0 3px #a66535,
    0 8px 18px rgba(0,0,0,.85);
}


/* =========================================================
   GREEN FELT
========================================================= */

#felt{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:11px;

  background:
    radial-gradient(
      ellipse at center,
      #126344 0%,
      #0c563a 50%,
      #063b29 100%
    );

  border:
    3px solid #092b1f;

  box-shadow:
    inset 0 0 55px rgba(0,0,0,.55),
    inset 0 0 0 2px rgba(255,255,255,.035);
}


/* felt texture */

#felt::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  opacity:.18;

  background:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 5px
    );
}


/* =========================================================
   TABLE WATERMARK
========================================================= */

#watermark{
  position:absolute;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%);

  z-index:1;

  text-align:center;

  color:
    rgba(170,214,186,.10);

  pointer-events:none;
}

#watermarkCrown{
  font-size:105px;
  line-height:90px;
}

#watermarkText{
  margin-top:5px;

  font-family:
    Georgia,
    serif;

  font-size:23px;

  letter-spacing:8px;

  line-height:32px;
}


/* =========================================================
   DOMINO BOARD AREA

   New engine will support:
   - multiple active ends
   - stake / სტავკა
   - four stake ports
   - proportional scale-to-fit
========================================================= */

#boardViewport{
  position:absolute;

  left:42px;
  top:72px;

  width:1010px;
  height:360px;

  z-index:20;

  overflow:visible;

  pointer-events:auto;
}

#dominoBoard{
  position:absolute;

  left:50%;
  top:50%;

  width:1200px;
  height:700px;

  transform:
    translate(-50%,-50%)
    scale(1);

  transform-origin:
    center center;
}


/* =========================================================
   LEFT ROOM PANEL
========================================================= */

#roomPanel{
  position:absolute;

  left:0;
  top:34px;

  width:188px;
  height:208px;

  z-index:40;

  padding:18px 14px;

  color:#ddd2c3;

  background:
    linear-gradient(
      145deg,
      rgba(18,13,10,.98),
      rgba(35,19,11,.96)
    );

  border:
    2px solid #3f2618;

  border-left:0;

  box-shadow:
    4px 5px 12px rgba(0,0,0,.75);
}

.room-label{
  margin-bottom:4px;

  color:#b6a998;

  font-size:14px;
}

.room-value{
  margin-bottom:13px;

  color:#f1e4cd;

  font-size:18px;
  font-weight:900;
}

#onlineStatus{
  margin-top:7px;

  color:#28e37e;

  font-size:16px;
  font-weight:bold;
}


/* =========================================================
   RIGHT QUOTE
========================================================= */

#quotePanel{
  position:absolute;

  right:0;
  top:34px;

  width:188px;
  height:175px;

  z-index:40;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  color:#d8d1c8;

  text-align:center;

  font-family:
    Georgia,
    serif;

  font-size:16px;
  font-style:italic;

  line-height:24px;

  background:
    linear-gradient(
      145deg,
      #151513,
      #090a09
    );

  border:
    2px solid #44382d;

  border-right:0;

  box-shadow:
    -4px 5px 12px rgba(0,0,0,.75);
}


/* =========================================================
   PLAYER AVATARS
   ONLY AVATARS ARE PERMANENTLY VISIBLE
========================================================= */

.player{
  position:absolute;

  z-index:100;

  width:92px;
  height:92px;

  cursor:pointer;
}

.avatar{
  position:relative;

  width:92px;
  height:92px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:visible;

  border-radius:50%;

  color:#fff;

  font-size:47px;

  background:
    radial-gradient(
      circle,
      #314b45,
      #101918
    );

  border:
    5px solid #d19a4c;

  box-shadow:
    0 0 0 4px #432410,
    0 8px 15px rgba(0,0,0,.75);
}

.player.active .avatar{
  border-color:#ffe170;

  box-shadow:
    0 0 0 4px #55300f,
    0 0 18px rgba(255,221,89,.75),
    0 8px 15px rgba(0,0,0,.75);
}

.online-dot{
  position:absolute;

  right:-1px;
  bottom:4px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:#19e86d;

  border:4px solid white;

  box-shadow:
    0 0 8px #17ff74;
}


/* exact positions based on target */

#player0{
  left:722px;
  top:187px;
}

#player3{
  left:91px;
  top:425px;
}

#player1{
  right:91px;
  top:425px;
}

#player2{
  left:722px;
  top:682px;
}


/* =========================================================
   OPPONENT HIDDEN HANDS
========================================================= */

.hidden-hand{
  position:absolute;

  z-index:80;

  display:flex;

  gap:5px;
}

.hidden-top{
  left:650px;
  top:269px;
}

.hidden-left{
  left:219px;
  top:400px;

  flex-direction:column;
}

.hidden-right{
  right:219px;
  top:400px;

  flex-direction:column;
}

.tile-back{
  width:61px;
  height:58px;

  border-radius:7px;

  background:
    repeating-linear-gradient(
      45deg,
      #141718 0,
      #141718 3px,
      #292d2e 3px,
      #292d2e 6px
    );

  border:
    3px solid #111;

  box-shadow:
    inset 0 0 0 2px #454849,
    0 4px 5px rgba(0,0,0,.7);
}

.hidden-left .tile-back,
.hidden-right .tile-back{
  width:58px;
  height:61px;
}


/* =========================================================
   PLAYER INFO POPUP
========================================================= */

#playerPopup{
  position:absolute;

  z-index:1000;

  display:none;

  width:205px;

  padding:14px;

  border-radius:13px;

  color:#eee6d7;

  background:
    linear-gradient(
      145deg,
      rgba(28,27,23,.98),
      rgba(7,10,8,.98)
    );

  border:
    2px solid #725035;

  box-shadow:
    0 12px 25px rgba(0,0,0,.85);
}

#playerPopup.show{
  display:block;
}

.popup-name{
  color:#fff1ce;

  font-size:17px;
  font-weight:900;
}

.popup-rating{
  margin-top:5px;

  color:#ffc94f;

  font-size:14px;
}

.popup-stats{
  margin-top:9px;

  padding-top:8px;

  border-top:
    1px solid #4d4234;

  color:#cfc8bb;

  font-size:12px;
  line-height:19px;
}


/* =========================================================
   TURN MESSAGE
========================================================= */

#turnMessage{
  position:absolute;

  left:50%;
  top:607px;

  transform:
    translateX(-50%);

  z-index:130;

  min-width:180px;

  padding:
    8px 20px;

  text-align:center;

  color:#ffe6a5;

  font-size:16px;
  font-weight:900;

  border-radius:20px;

  background:
    rgba(7,24,17,.88);

  border:
    1px solid rgba(211,171,92,.55);

  box-shadow:
    0 4px 9px rgba(0,0,0,.65);
}


/* =========================================================
   THESE CONTROLS MUST NOT EXIST VISUALLY
========================================================= */

.top-actions,
.bottom-right-actions,
#ribaBtn,
#surrenderBtn,
#soundBtn,
#settingsBtn,
#emojiTopBtn{
  display:none !important;
}


/* =========================================================
   PORTRAIT WARNING
========================================================= */

#rotateWarning{
  position:fixed;

  inset:0;

  z-index:999999;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:10px;

  padding:30px;

  color:#f8e7c5;

  text-align:center;

  background:
    radial-gradient(
      circle,
      #2c180d,
      #050302
    );
}

#rotateWarning .phone{
  font-size:70px;
}

#rotateWarning strong{
  font-size:23px;
}

#rotateWarning span{
  max-width:320px;

  color:#cbbda9;

  line-height:22px;
}

@media (orientation:portrait){

  #rotateWarning{
    display:flex;
  }

}

   IMPORTANT: STYLE CONTINUES IN PART 2
========================================================= */
